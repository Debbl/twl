[package]
name = "swc_plugin_twl_macro"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"

[dependencies]
once_cell = "1.21.3"
regex = "1.12.2"
swc_core = { version = "50.2.3", features = [
  "common",
  "ecma_ast",
  "ecma_plugin_transform",
  "ecma_visit",
] }
